[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "figma-codegen"
version = "0.1.0"
description = "Figma → Jetpack Compose / SwiftUI with your UIKit, using a self-hosted OpenAI-compatible LLM"
requires-python = ">=3.9"
dependencies = [
  "openai>=1.40",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# `figma-codegen mcp`; the SDK needs Python 3.10+ (the rest of the package runs on 3.9).
mcp = ["mcp>=1.8,<2; python_version >= '3.10'"]

[project.scripts]
figma-codegen = "codegen.cli:main"

[tool.setuptools.packages.find]
include = ["codegen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
