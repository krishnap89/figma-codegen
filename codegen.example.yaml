# Copy to codegen.yaml and adjust. Relative paths are resolved against this file.

llm:
  base_url: http://qwen.internal:8000/v1   # your OpenAI-compatible Qwen endpoint
  model: qwen-coder                        # model name as served (vLLM --served-model-name)
  api_key: not-needed
  temperature: 0.1
  max_tokens: 4096
  stream: true                   # avoids 504s: a gateway in front of the server may time out a long non-streamed reply

agent:
  max_rounds: 4                  # generate → validate → fix rounds
  max_tool_calls_per_round: 8    # lookup tool calls allowed before the final answer
  use_tools: true                # false if your server has no tool-calling support
  max_examples: 2                # few-shot examples per prompt (skill examples count first)
  max_skill_chars: 6000          # skill text per prompt; lowest-priority skills are dropped first
  skill_tool: false              # true: the model may pull in unselected skills with load_skill

figma:
  # token: prefer the FIGMA_TOKEN environment variable

paths:
  manifest: manifest/components.json
  tokens: manifest/tokens.json
  examples: examples
  skills: skills                 # team conventions, added only when a screen needs them
  traces: .codegen/traces
  figma_json: .codegen/figma     # every Figma download is saved here (empty = don't save)
  compare: .codegen/compare      # Figma-vs-code pages from `compare` / `generate --compare`
  # repo_root: ../android-app    # enables search_code / read_file tools

platforms:
  compose:
    # A small Gradle project that already depends on your UIKit. The generated file is
    # written here and compiled. Keep the Gradle daemon warm for fast rounds.
    sandbox_file: ../codegen-sandbox-android/app/src/main/java/sandbox/Generated.kt
    compile_cwd: ../codegen-sandbox-android
    compile_cmd: ["./gradlew", ":app:compileDebugKotlin", "-q", "--offline"]
    compile_timeout: 600
    forbidden_patterns: []       # extra regexes, e.g. "import com.company.legacy"
    # Visual check (`compare`, `generate --compare`): screenshot test that renders CodegenRenderTarget
    # to $CODEGEN_RENDER_OUT. See README "Visual check" for the test. --rerun: env vars aren't task inputs.
    # render_cmd: ["./gradlew", ":app:testDebugUnitTest", "--tests", "sandbox.RenderTest",
    #              "--rerun", "-q", "--offline"]
    # render_output: app/build/codegen-render.png   # only if the test can't see $CODEGEN_RENDER_OUT
  swiftui:
    # Needs macOS. Use xcodebuild for an iOS target (swift build only builds for macOS).
    sandbox_file: ../codegen-sandbox-ios/Sandbox/Generated.swift
    compile_cwd: ../codegen-sandbox-ios
    compile_cmd: ["xcodebuild", "-scheme", "Sandbox", "-destination", "generic/platform=iOS Simulator", "-quiet", "build"]
    compile_timeout: 900
    forbidden_patterns: []
    # render_cmd: ["xcodebuild", "test", "-scheme", "Sandbox", "-destination", "platform=iOS Simulator,name=iPhone 16",
    #              "-only-testing:SandboxTests/RenderTests/testRender", "-quiet"]

# `figma-codegen readiness`: score a frame 0–100 for designers (ready ≥ 85, almost ≥ 60).
readiness:
  weights:                       # points an issue costs, before normalising by frame size
    missing_component: 6
    no_auto_layout: 6
    hand_drawn_graphic: 3
    unknown_variant: 3
    unbound_style: 2
    value_without_token: 2
    default_name: 1
  # Device decoration drawn in the frame. Ignored EVERYWHERE (spec, generate, warnings), not only
  # in readiness. Case-insensitive globs; [] keeps every layer.
  ignore_layers: ["_*", "*Statusbar*", "*Status Bar*", "*Home Indicator*", "*Keyboard*"]

# `figma-codegen import-figma`: the naming conventions of your Figma library. The importer uses them
# to draft the manifest; `import-figma --check` lists where the library breaks them (for designers).
figma_import:
  private_prefixes: [".", "_"]          # building blocks never mapped to code
  visibility_prefixes: ["👁"]           # boolean '👁 Title' -> prop showTitle
  state_props: [State]                  # variants that hold interaction states only
  interaction_states: [Default, Normal, Enabled, Rest, Idle, Hover, Hovered, Pressed, Active, Focus, Focused,
                       Disabled, Inactive]
  disabled_values: [Disabled, Inactive] # State=Disabled -> enabled: false
  action_names: [Button, Link, Action, Chip, Tab, Menu Item, FAB]       # -> kind: action
  input_names: [Text Field, Text Area, Input, Search Bar, Search Field, Field]   # -> kind: input
  toggle_names: [Checkbox, Check Box, Switch, Toggle, Radio]              # -> kind: input, stateType: Boolean
  prop_aliases: {}                      # Figma property -> manifest prop, e.g. {Type: style}
  checks:                               # turn single --check rules off with false
    no_description: true
    boolean_variant: true
    state_values: true
    inconsistent_values: true
    renamed_prop: true
    text_not_property: true
